<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills - {Dr.Code}</title>
  <meta name="description" content="Herramientas y tecnologías que usa {Dr.Code} para crear soluciones digitales de calidad.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('drcode_theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <canvas id="matrix"></canvas>
  
  <div id="header-container"></div>

  <main id="main" tabindex="-1">
    <section class="section" style="text-align: center; margin-bottom: 0;">
      <h1>Skills & Herramientas</h1>
      <p class="hero-subtitle" style="max-width: 500px;">Tecnologías que dominamos para crear soluciones de alto nivel.</p>
    </section>

    <div id="skills-carousel"></div>

    <section class="section" style="text-align: center;">
      <h2>¿Listo para trabajar juntos?</h2>
      <p style="margin-bottom: 1.5rem;">Contáctanos y descubre cómo podemos ayudarte.</p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="contacto.html" class="btn btn-primary">Contactar</a>
        <a href="calendario.html" class="btn btn-secondary">Agendar Cita</a>
      </div>
    </section>
  </main>

  <div id="modal-container"></div>
  <div id="footer-container"></div>

  <script src="js/canvas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
