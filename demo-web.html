<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Páginas Web - {Dr.Code}</title>
  <meta name="description" content="Demo de páginas web profesionales por {Dr.Code}.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('drcode_theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <canvas id="matrix"></canvas>
  <div id="header-container"></div>
  <main id="main" tabindex="-1">
    <div class="container">
      <section class="section" style="text-align: center;">
        <h1>Demo: Páginas Web</h1>
        <p class="hero-subtitle">Sitios web profesionales con diseño responsivo, optimizados para SEO y conversión.</p>
        <div class="hero-cta" style="justify-content: center;">
          <a href="contacto.html" class="btn btn-primary">Solicitar</a>
          <a href="servicios.html" class="btn btn-secondary">Volver a Servicios</a>
        </div>
      </section>
    </div>
  </main>
  <div id="modal-container"></div>
  <div id="footer-container"></div>
  <script src="js/canvas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
