<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamiento - {Dr.Code}</title>
  <meta name="description" content="Agenda una cita con {Dr.Code}.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('drcode_theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <canvas id="matrix"></canvas>
  
  <div id="header-container"></div>

  <main id="main" tabindex="-1">
    <div class="container">
      <section class="section" style="text-align: center;">
        <h1>Agenda una Cita</h1>
        <p class="hero-subtitle" style="text-align: center;">
          Selecciona el día y horario que prefieras. Te contactaremos para confirmar tu cita.
        </p>

        <p class="week-label" id="weekLabel"></p>

        <div class="calendar-days" id="calendar"></div>

        <ul class="slot-legend">
          <li><span class="legend-dot available" aria-hidden="true"></span>Disponible</li>
          <li><span class="legend-dot pending" aria-hidden="true"></span>Pendiente</li>
          <li><span class="legend-dot confirmed" aria-hidden="true"></span>Confirmada</li>
          <li><span class="legend-dot rejected" aria-hidden="true"></span>No disponible</li>
        </ul>

        <div style="margin-top: 1.5rem;">
          <button id="weekToggle" class="btn btn-secondary">Siguiente Semana →</button>
        </div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="calendarModalOverlay" aria-hidden="true">
    <div class="modal" id="calendarModal" role="dialog" aria-labelledby="calModalTitle" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="calModalTitle">Confirmar Cita</h2>
        <button class="modal-close" id="calModalClose" aria-label="Cerrar">&times;</button>
      </div>
      <form class="contact-form" id="calendarForm" novalidate>
        <div class="form-group">
          <label for="calName">Nombre <span class="form-required">*</span></label>
          <input type="text" id="calName" name="name" required placeholder="Tu nombre completo" autocomplete="name" data-autofocus>
        </div>
        <div class="form-group">
          <label for="calPhone">Teléfono <span class="form-required">*</span></label>
          <input type="tel" id="calPhone" name="phone" required placeholder="+593 XX XXX XXXX" autocomplete="tel">
        </div>
        <div class="form-group">
          <label for="calEmail">Email</label>
          <input type="email" id="calEmail" name="email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="calService">Servicio de interés</label>
          <select id="calService" name="service">
            <option value="">Selecciona un servicio</option>
            <option value="web">Página Web</option>
            <option value="landing">Landing Page</option>
            <option value="carrito">Carrito de Compras</option>
            <option value="menu">Menú Digital</option>
            <option value="tarjeta">Tarjeta de Presentación</option>
            <option value="automatizacion">Automatización</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="calMessage">Descripción</label>
          <textarea id="calMessage" name="message" placeholder="Cuéntanos sobre tu proyecto..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa-brands fa-whatsapp"></i> Enviar por WhatsApp</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="adminLoginOverlay" aria-hidden="true">
    <div class="modal admin-modal" id="adminLoginModal" role="dialog" aria-modal="true" aria-labelledby="adminLoginTitle">
      <div class="modal-header">
        <h3 class="modal-title" id="adminLoginTitle">Acceso Admin</h3>
        <button class="modal-close" id="adminLoginClose" aria-label="Cerrar">&times;</button>
      </div>
      <div class="admin-body">
        <label class="sr-only" for="adminPass">Contraseña de administrador</label>
        <input type="password" id="adminPass" class="admin-pass" placeholder="Contraseña" autocomplete="current-password" data-autofocus>
        <button id="adminLoginBtn" class="btn btn-primary" style="width:100%;">Ingresar</button>
      </div>
    </div>
  </div>

  <div id="modal-container"></div>

  <div id="footer-container"></div>

  <script src="js/canvas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
